apiVersion: batch/v1
kind: Job
metadata:
  name: evo-burgers-multi-job
  namespace: cisuc
  labels:
    job-name: evo-burgers-multi-job
    scheduling.run.ai/queue-name: cisuc-regular
spec:
  completions: 5
  parallelism: 5
  completionMode: Indexed
  template:
    metadata:
      labels:
        job-name: evo-burgers-multi-job
        scheduling.run.ai/queue-name: cisuc-regular
    spec:
      schedulerName: kai-scheduler
      priorityClassName: high
      restartPolicy: Never
      containers:
      - name: evo-burgers
        image: registry.ml-cluster.dei.uc.pt/library/evo-burgers:1.0
        # Use the index to select the specific config file from the mounted directory
        command: ["/bin/sh", "-c"]
        args:
        - |
          cp /configs/config-$JOB_COMPLETION_INDEX.yml /app/config.yml
          mamba run -n hamburguer python token_ev_ga.py
        volumeMounts:
        - name: config-volume
          mountPath: /configs
        env:
        - name: DEBIAN_FRONTEND
          value: noninteractive
      volumes:
      - name: config-volume
        configMap:
          name: evo-burgers-configs  # Contains keys: config-0.yml, config-1.yml, etc.
